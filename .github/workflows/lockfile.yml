# One-off: generate package-lock.json on GitHub (npm isn't reachable from the dev workspace).
name: Generate lockfile
on:
  push:
    branches: [ci/lockfile]
permissions:
  contents: write
jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --package-lock-only --no-audit --no-fund --ignore-scripts
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "Add package-lock.json generated by npm $(npm -v)"
          git push
